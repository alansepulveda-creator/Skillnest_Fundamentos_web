<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagina de perfil</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="barra">
        <section class="barra-true">
            <h1>Perfil</h1>
            <nav class="navegacion">
                <a href="#">Inicio</a>
                <a href="#">Mi perfil</a>
                <a href="#">Conexiones</a>
                <button>Cerrar sesión</button>
            </nav>
        </section>
    </header>
    <main class="blanco">
        <section class="white">
            <div class="blu">
                <div class="separar">
                    <img src="static/images/user-icon.png" alt="icono de usuario" class="imagen">
                    <h2>Jane Doe</h2>
                    <p class="separado">Bergen, Noruega</p>
                    <p>Desarrolladora Frontend</p>
                    <p>Conocimientos en HTML, CSS, JavaScript</p>
                    <a href="#" class="edit">⚙ Editar perfil</a>
                </div>
            </div>
        </section>
        <section class="columna_blanca">
            <div class="Solicitudes">
                <div class="row">
                    <h3>Solicitudes de conexión</h3>
                    <button class="boton1">Ver todas</button>
                </div>
                <div class="row">
                    <img src="static/images/user-icon.png" alt="icono de usuario">
                    <h4 class="h4">Steve Jobs</h4>
                    <button class="si">✔</button>
                    <button class="x">X</button>
                </div>
                <div class="row">
                    <img src="static/images/user-icon.png" alt="icono de usuario">
                    <h4 class="h4">Bill Gates</h4>
                    <button class="si">✔</button>
                    <button class="x">X</button>
                </div>
                <div class="Conexiones">
                    <div class="row2">
                        <h3>Tus Conexiones</h3>
                        <button class="boton-s">Ver Todas</button>
                    </div>
                    <div class="row">
                        <img src="static/images/user-icon.png" alt="icono de usuario">
                        <h4 class="personas">Richard Stallman</h4>
                    </div>
                    <div class="row">
                        <img src="static/images/user-icon.png" alt="icono de usuario">
                        <h4 class="personas">Linus Torvalds</h4>
                    </div>
                    <div class="row">
                        <img src="static/images/user-icon.png" alt="icono de usuario">
                        <h4 class="personas">Ada Lovelace</h4>
                    </div>
                    <div class="row">
                        <img src="static/images/user-icon.png" alt="icono de usuario">
                        <h4>Grace Hopper</h4>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
