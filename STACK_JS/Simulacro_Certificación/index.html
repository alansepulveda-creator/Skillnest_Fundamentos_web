<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alan Sepúlveda">
    <title>Simulacro de Certificación</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="nav">
            <div>
                <img src="static/images/logo.png" alt="tacopalace">
                <h1 class="titulo">Taco<span class="span">Palace</span></h1>
            </div>
            <div class="separacion">
                <form action="#" class="login">
                    <input type="email" placeholder="email" id="email">
                    <button id="botonLogin">Login</button>
                </form>
                <div class="contador-compras">
                    <img src="static/images/carrito.png" alt="carrito">
                    <p id="numeroCompra">0</p>
                </div>
            </div>
        </nav>
    </header>
    <main class="contenedor-p">
        <div class="contenedor-imagenes">
            <div class="imagen1">
                <img src="static/images/enchiladas.jpg" alt="enchiladas">
                <p>Enchiladas</p>
            </div>
            <div class="imagen2">
                <img src="static/images/tacos.jpg" alt="tacos">
                <p>Tacos</p>
            </div>
            <div class="imagen3">
                <img src="static/images/flautas.jpg" alt="flautas">
                <p>Flautas</p>
            </div>
            <div class="imagen4">
                <img src="static/images/gorditas.jpg" alt="gorditas">
                <p>Gorditas</p>
            </div>
            <div class="imagen5">
                <img src="static/images/tostadas.jpg" alt="tostadas">
                <p>Tostadas</p>
            </div>
            <div class="imagen6">
                <img src="static/images/enfrijoladas.jpg" alt="enfrijoladas">
                <p>Enfrijoladas</p>
            </div>
        </div>
        <div class="row">
            <section class="seccion1">
                <div>
                    <h1>La mejor variedad en platillos de comida <span class="span">mexicana</span></h1>
                    <p>Contamos con <a href="">servicio</a> a <span class="span-amarillo">domicilio</span></p>
                </div>
                <img src="static/images/comida-mexicana.jpg" alt="comida-mexicana" class="comida-mexicana" id="comidaMexicana">
            </section>
            <section class="seccion2">
                <h1>Recomendados:</h1>
                <div class="column">
                    <img src="static/images/orden-tacos.jpg" alt="orden-tacos" class="orden-tacos">
                    <div class="divroww">
                        <div>
                            <p>Orden de Tacos</p>
                            <a href="">Ver Más...</a>
                        </div>
                        <button class="btnmas" id="btnMas1">+</button>
                    </div>
                </div>
                <div class="column">
                    <img src="static/images/orden-flautas.jpg" alt="orden-flautas" class="orden-flautas">
                    <div class="divrow">
                        <div>
                            <p>Orden de Flautas</p>
                            <a href="">Ver Más...</a>
                        </div>
                        <button class="btnmas" id="btnMas2">+</button>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
