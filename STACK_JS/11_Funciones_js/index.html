<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alan Sepúlveda">
    <title>Desafio con Arreglos js</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <div class="container">
        <h1>Funciones JS</h1>
        <div class="targeta">
            <h2>Ejemplo 1</h2>
            <p>Funciones sin parametros: saludar</p>
            <button onclick="saludar()">Ejecutar</button>
        </div>
        <div class="targeta">
            <h2>Funciones con parametros</h2>
            <p></p>
            <button onclick="saludarParam('Alan')">Ejecutar</button>
        </div>
        <div class="targeta">
            <h2>Ejemplo 3</h2>
            <p>Encontrar el numero mayor</p>
            <button onclick="encontrarmayor()">Ejecutar</button>
        </div>
        <div class="targeta">
            <h2>tarea</h2>
            <p>sumar dos numeros y restar un tercero, luego mostrar el resultado</p>
            <button onclick="operacionmatematica()">Ejecutar</button>
        </div>
    </div>
    <script src="static/js/script.js"></script>
</body>

</html>
