<body>
    <div class="contenedor">
        <h1>FIZZBUZZ</h1>
        <div class="card">
            <h2>Reglas FizzBuzz</h2>
            <ul>
                <li>Si un numero es divisible por 3, muestra "Fizz".</li>
                <li>Si un numero es divisible por 5, muestra "Buzz".</li>
                <li>Si un numero es divisible por ambos 3 y 5, muestra "FizzBuzz".</li>
                <li>Si nu muestra ninguna de estas condiciones, muestra el numero tal cual.</li>
            </ul>
        </div>
        <div class="card">
            <h1>función</h1>

        </div>
